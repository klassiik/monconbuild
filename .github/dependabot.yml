version: 2
updates:
  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "klassiik"
    labels:
      - "dependencies"
      - "security"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
    # "direct" limits version-update PRs to the ~24 packages actually declared in
    # frontend/package.json. Under "all", dependabot also proposed every indirect
    # package -- 433 were outdated against a 10-PR limit, so the queue refilled
    # faster than it could be cleared and never converged. The indirect tree is
    # better handled in bulk by `npm update` plus `npm audit fix`, which move
    # hundreds of packages in one lockfile commit. Security advisories for
    # indirect packages still surface through Dependabot security updates, which
    # are configured in repo settings and are not governed by this key.
    allow:
      - dependency-type: "direct"
    ignore:
      # Ignore major version updates for stable packages
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 is a rewrite, not an upgrade: it needs @tailwindcss/postcss,
      # `@import "tailwindcss"` in place of the @tailwind directives, and the
      # theme colors behind `@apply border-border` moved into a CSS @theme block.
      # v3 patch/minor updates still come through. See #149.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint and @eslint/js must move together -- @eslint/js@10 declares a peer
      # of eslint ^10 -- so a major on either one alone breaks the pair. This repo
      # is on eslint 9. Nothing in CI catches the mismatch: .npmrc sets
      # legacy-peer-deps=true so npm installs the unmet peer without erroring, and
      # the only checks are Vercel builds, which run `npm run build` and never
      # invoke eslint. Such a bump lands green and silently breaks linting.
      # eslint 10 also raises the engines floor to node ^20.19 || ^22.13 || >=24
      # against the >=18 declared in package.json. Upgrade both together as a
      # deliberate change, not a dependency bump. 9.x patch/minor updates still
      # come through. See #151.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # react-router v6 is pinned by the static-site generator: vite-react-ssg
      # 0.9.1 declares `peerDependencies: { "react-router-dom": "^6.14.1" }`.
      # v7 is a rewrite that would break routing and the SSG prerender pass, and
      # .npmrc sets legacy-peer-deps=true so npm installs the unmet peer without
      # erroring rather than failing the install. Moving to v7 requires a
      # vite-react-ssg release that supports it, so this is a coordinated
      # migration and not a dependency bump. v6 patch/minor updates still come
      # through. See #172.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]

  # Backend (pip) is intentionally not watched. backend/server.py is a FastAPI app
  # with no deployment path: Vercel builds only frontend/ (static, no functions or
  # Python rewrites), and POST /api/analytics/errors returns 404 in production --
  # server.py doesn't define that route either. Every pip PR patched code that
  # never runs. Restore this block if the backend is ever actually deployed.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
