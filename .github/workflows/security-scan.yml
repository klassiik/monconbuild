name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run npm audit
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate
          echo "NPM_AUDIT_EXIT_CODE=$?" >> $GITHUB_ENV
        continue-on-error: true
        
      - name: Generate npm audit report
        working-directory: ./frontend
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true
        
      - name: Upload npm audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Deliberately no continue-on-error: this job is the gate. `npm run lint`
      # exits non-zero on any error and on more than --max-warnings (currently
      # 114, the count at the time of writing), so new lint debt fails the PR
      # instead of accumulating unnoticed the way the previous 117 warnings did.
      # Lower that number in frontend/package.json as warnings are paid down.
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  # The Python Security Audit job was removed. backend/ is a FastAPI app with no
  # deployment path -- Vercel builds only frontend/ -- and this job's failures
  # were the sole reason the whole workflow was disabled manually, which also
  # took down Dependency Review, CodeQL and NPM Audit. Restore it alongside the
  # dependabot pip block if the backend is ever actually deployed.

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript
          queries: security-and-quality
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.1
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:javascript"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC
          # lightningcss is MPL-2.0 and is required by Tailwind v4 (@tailwindcss/postcss).
          # It runs only at build time to compile CSS and is not shipped to the site, and
          # MPL-2.0 is file-level copyleft, so using it unmodified is fine. Excepted per
          # package rather than allowing MPL-2.0 for every dependency.
          allow-dependencies-licenses: >-
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc

  ssl-check:
    name: SSL Certificate & Headers Check
    runs-on: ubuntu-latest
    if: false  # Disabled - headers are configured in Vercel
    steps:
      - name: Check SSL certificate validity
        run: |
          echo "Checking SSL certificate..."
          echo | openssl s_client -connect www.monconbuild.com:443 -servername www.monconbuild.com 2>/dev/null | openssl x509 -noout -dates -subject -issuer
          
      - name: Check HTTPS redirect
        run: |
          echo "Checking HTTPS redirect..."
          curl -sI http://www.monconbuild.com | grep -i "location: https"
        continue-on-error: true
          
      - name: Check security headers
        run: |
          echo "Checking security headers..."
          curl -sI https://www.monconbuild.com | grep -E "Strict-Transport-Security|X-Frame-Options|X-Content-Type-Options|Content-Security-Policy|X-XSS-Protection|Referrer-Policy"
        continue-on-error: true
          
      - name: Verify required headers present
        run: |
          HEADERS=$(curl -sI https://www.monconbuild.com)
          
          # Check for each required header
          if echo "$HEADERS" | grep -q "Strict-Transport-Security"; then
            echo "✓ HSTS header found"
          else
            echo "✗ HSTS header missing"
          fi
          
          if echo "$HEADERS" | grep -q "X-Frame-Options"; then
            echo "✓ X-Frame-Options header found"
          else
            echo "✗ X-Frame-Options header missing"
          fi
          
          if echo "$HEADERS" | grep -q "X-Content-Type-Options"; then
            echo "✓ X-Content-Type-Options header found"
          else
            echo "✗ X-Content-Type-Options header missing"
          fi
        continue-on-error: true

  owasp-zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://www.monconbuild.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          fail_action: false
          
      - name: Upload ZAP scan results
        uses: actions/upload-artifact@v7
        with:
          name: zap-scan-results
          path: |
            report_html.html
            report_md.md
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, lint, codeql-analysis]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # NPM Audit
          if [ -f npm-audit-report/npm-audit-report.json ]; then
            VULN_COUNT=$(jq '.metadata.vulnerabilities | to_entries | map(.value) | add' npm-audit-report/npm-audit-report.json)
            echo "### 📦 NPM Audit" >> $GITHUB_STEP_SUMMARY
            echo "Total vulnerabilities: $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # ESLint
          echo "### 🧹 ESLint" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # CodeQL
          echo "### 🔍 CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # SSL
          echo "### 🔒 SSL/TLS Check" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.ssl-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Scan completed at: $(date)" >> $GITHUB_STEP_SUMMARY
